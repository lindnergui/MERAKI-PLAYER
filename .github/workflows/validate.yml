name: Validar aplicativo

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validar:
    name: Testes Rust e Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Preparar dependências
        run: flutter pub get
      - name: Gerar integração Flutter e Rust
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          flutter_rust_bridge_codegen generate
      - name: Testar núcleo e protocolos de servidor
        run: cargo test --locked
      - name: Analisar aplicativo
        run: flutter analyze
      - name: Testar interface
        run: flutter test
