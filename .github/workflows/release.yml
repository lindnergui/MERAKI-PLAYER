name: Compilar e publicar Meraki

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validar:
    uses: ./.github/workflows/validate.yml

  build-android:
    needs: validar
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # flutter_rust_bridge/Cargokit compiles rust_core for the Android ABIs
      # while Gradle builds the APK.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Install Flutter-Rust code generator
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Generate Flutter-Rust bindings
        run: flutter_rust_bridge_codegen generate

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare Android release asset
        run: mv build/app/outputs/flutter-apk/app-release.apk meraki-android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: meraki-android
          path: meraki-android.apk
          if-no-files-found: error

  build-flatpak:
    needs: validar
    name: Build Linux Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      # The project application ID is com.github.lindnergui.meraki, so this
      # must use the matching Flatpak manifest rather than an io.github path.
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/com.github.lindnergui.meraki.yml
          bundle: meraki.flatpak
          branch: stable
          cache-key: flatpak-${{ github.sha }}
          verbose: true
          upload-artifact: false

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: meraki-flatpak
          path: meraki.flatpak
          if-no-files-found: error

  build-windows:
    needs: validar
    uses: ./.github/workflows/windows.yml

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-flatpak, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: meraki-android
          path: release-assets

      - name: Download Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: meraki-flatpak
          path: release-assets

      - name: Baixar instaladores Windows
        uses: actions/download-artifact@v4
        with:
          name: meraki-windows
          path: release-assets

      - name: Create GitHub Release and attach assets
        uses: softprops/action-gh-release@v2
        with:
          name: Meraki Player ${{ github.ref_name }} — Versão para Windows
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/meraki-android.apk
            release-assets/meraki.flatpak
            release-assets/meraki-windows-setup.exe
            release-assets/meraki-windows-portable.zip
