[package]
# Keep the Cargo library name aligned with the FFI plugin generated by
# flutter_rust_bridge. The platform build bundles this exact library stem.
name = "rust_lib_meraki"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
futures = "0.3.31"
lofty = "0.25.1"
md5 = "0.8.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1.18", features = ["v4", "v5"] }
walkdir = "2.5"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"

[lints.clippy]
all = "warn"
